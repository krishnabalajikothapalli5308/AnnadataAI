name: Keep Streamlit app awake

on:
  schedule:
    - cron: "0 */8 * * *"   # every 8 hours (UTC)
  workflow_dispatch:         # lets you run it manually from the Actions tab

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit the app
        run: |
          python - <<'EOF'
          from playwright.sync_api import sync_playwright

          URL = "https://annadataaiap.streamlit.app/"

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(URL, timeout=120000)
              try:
                  page.get_by_role("button", name="Yes, get this app back up!").click(timeout=15000)
                  print("App was asleep - clicked the wake button")
              except Exception:
                  print("No wake button - app was already awake")
              page.wait_for_timeout(30000)  # stay 30s so it counts as a real visit
              print("Page title:", page.title())
              browser.close()
          EOF
